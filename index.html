<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chhinzer Track</title>
<meta name="description" content="Chhinzer Track: a one-second daily check-in for how you feel.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chhinzer Track">
<meta name="application-name" content="Chhinzer Track">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23FFC83D'/><ellipse cx='37' cy='42' rx='4.4' ry='4.6' fill='%231c1c1e'/><ellipse cx='63' cy='42' rx='4.4' ry='4.6' fill='%231c1c1e'/><path d='M30 66 Q50 88 70 66' fill='none' stroke='%231c1c1e' stroke-width='5' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#EFEFF4; --text:#1C1C1E; --text2:#6C6C70; --text3:#B4B4B9;
  --sep:rgba(60,60,67,.18); --tint:#2A55C9; --on-tint:#FFFFFF; --tint-soft:rgba(42,85,201,.14);
  --danger:#D70015; --bar:rgba(249,249,251,.92); --seg-on:#FFFFFF;
  --radius-lg:22px; --radius:14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#F2F2F7; --text2:#A1A1A6; --text3:#5A5A5F;
    --sep:rgba(84,84,88,.6); --tint:#7C9CFF; --on-tint:#0B1433; --tint-soft:rgba(124,156,255,.18);
    --danger:#FF6961; --bar:rgba(22,22,24,.92); --seg-on:#636366;
  }
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px}
.wordmark{font-size:15px;font-weight:600;color:var(--text2);letter-spacing:-.01em}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--tint);width:44px;height:44px;margin-right:-10px;display:grid;place-items:center;border-radius:12px;cursor:pointer}
.icon-btn svg{width:24px;height:24px}
.title-block{margin:2px 0 18px}
h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em;margin:0}
.sub{color:var(--text2);font-size:15px;margin:2px 0 0}

.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;margin:0 0 16px}
.card h2{font-size:20px;font-weight:600;margin:0;text-align:center;letter-spacing:.01em}
.section-title{font-size:15px;color:var(--text2);font-weight:600;margin:26px 4px 8px}
.footnote{font-size:13px;color:var(--text2);margin:0 4px 16px;line-height:1.45}

/* ---------- Check-in editor ---------- */
.editor{display:flex;flex-direction:column;align-items:center}
.face-stage{width:112px;height:112px;margin:12px 0 6px}
.face-stage svg{width:100%;height:100%;display:block}
.readout{display:flex;align-items:baseline;justify-content:center;gap:10px;min-height:50px}
.readout-num{font-size:42px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.readout-num small{font-size:17px;color:var(--text2);font-weight:600;letter-spacing:0}
.readout-label{font-size:20px;font-weight:600;color:var(--text2)}
.readout.empty{align-items:center}
.readout.empty .readout-label{font-size:15px;font-weight:500}
.scale{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 8px}
.scale-end{width:28px;height:28px;flex:none}
.scale-end svg{width:100%;height:100%;display:block}

.range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:36px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#8E9BB3,#D8D2C4 50%,#FFC83D)}
.range::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#8E9BB3,#D8D2C4 50%,#FFC83D)}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.18);transition:opacity .15s}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.18)}
.range.unset::-webkit-slider-thumb{opacity:.35}
.range.unset::-moz-range-thumb{opacity:.35}

.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
.num{appearance:none;border:0;background:var(--card2);font-size:16px;font-weight:600;height:42px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0;transition:background .12s,color .12s}
.num[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}

.extras{width:100%}
.extras:not(:empty){margin-top:18px}
.note{display:block;width:100%;min-height:80px;resize:vertical;border:0;border-radius:12px;background:var(--card2);color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:12px 14px}
.note::placeholder{color:var(--text2)}
.note-status{font-size:13px;color:var(--text2);height:18px;margin:4px 2px 0;opacity:0;transition:opacity .25s}
.note-status.on{opacity:1}
.row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px}
.btn-text{appearance:none;border:0;background:none;color:var(--tint);font-size:17px;padding:10px 4px;cursor:pointer;border-radius:8px}
.btn-text.danger{color:var(--danger)}
.btn-fill{appearance:none;border:0;background:var(--tint);color:var(--on-tint);font-size:17px;font-weight:600;padding:10px 22px;border-radius:12px;cursor:pointer}
.btn-plain{appearance:none;border:0;background:var(--card2);color:var(--tint);font-size:15px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
.add-note{display:block;margin:0 auto}

/* ---------- Today compact ---------- */
.compact{display:flex;align-items:center;gap:14px}
.compact .mini{width:56px;height:56px;flex:none}
.compact-score{font-size:30px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.compact-score small{font-size:17px;color:var(--text2);font-weight:600;letter-spacing:0}
.compact-label{color:var(--text2);font-size:15px;font-weight:500}
.compact .btn-plain{margin-left:auto}
.compact-foot{margin:16px 0 0;padding-top:12px;border-top:.5px solid var(--sep)}
.compact-note{appearance:none;border:0;background:none;padding:0;text-align:left;color:var(--text2);font-size:15px;cursor:pointer;width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.today-kicker{font-size:15px;color:var(--text2);font-weight:600;margin:0 0 12px}

/* ---------- History ---------- */
.list{background:var(--card);border-radius:var(--radius);overflow:hidden}
.day-row{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;cursor:pointer;position:relative}
.day-row + .day-row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.day-row:active{background:var(--card2)}
.day-row .mini{width:30px;height:30px;flex:none}
.empty-dot{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px dashed var(--text3)}
.day-main{flex:1;min-width:0}
.day-title{font-size:17px}
.day-meta{font-size:15px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-meta b{color:var(--text);font-weight:600}
.day-add{color:var(--tint)}
.chev{width:9px;height:14px;flex:none;color:var(--text3)}
.more{display:block;margin:14px auto 0}

/* ---------- Segmented control ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(118,118,128,.14);border-radius:9px;padding:2px;margin:0 0 14px}
.seg button{appearance:none;border:0;background:none;font-size:13px;font-weight:600;height:30px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- Progress ---------- */
.scrub{min-height:70px;margin-bottom:4px}
.scrub-hint{font-size:15px;color:var(--text2);padding-top:8px}
.scrub-date{font-size:13px;color:var(--text2);font-weight:600}
.scrub-score{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.scrub-score .mini{width:24px;height:24px}
.scrub-score span.lbl{font-size:17px;color:var(--text2);font-weight:600}
.scrub-note{font-size:15px;color:var(--text2);overflow-wrap:anywhere}
.chart-host{width:100%}
.chart{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.g-line{stroke:var(--sep);stroke-width:.6}
.g-line.major{stroke-width:1}
.g-text{fill:var(--text2);font-size:11px}
.c-line{stroke:var(--text3);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.c-dot{stroke:var(--card);stroke-width:1.2}
.c-avg{stroke:var(--tint);stroke-width:1.5;stroke-dasharray:4 4}
.c-avg-t{fill:var(--tint);font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.c-scrub{stroke:var(--text2);stroke-width:1}
.c-ring{fill:none;stroke:var(--text);stroke-width:2}
.c-empty{fill:var(--text2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.stat-label{font-size:13px;color:var(--text2)}
.stat-value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-value small{font-size:15px;color:var(--text2);font-weight:500}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.period-name{font-size:15px;font-weight:600}
.period-range{font-size:13px;color:var(--text2)}
.period-avg{font-size:32px;line-height:1.15;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.period-avg small{font-size:15px;color:var(--text2);font-weight:600;letter-spacing:0}
.period-meta{font-size:13px;color:var(--text2);margin-top:2px}
.change{margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
.change-label{font-size:13px;color:var(--text2)}
.change-main{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.change-pct{font-size:15px;color:var(--text2);margin-left:6px;font-weight:500}
.change-none{font-size:15px;color:var(--text2)}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-inner{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#8E8E93;padding:4px 0;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--tint)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;transition:opacity .2s,transform .2s;background:rgba(44,44,46,.95);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;display:flex;gap:16px;align-items:center;z-index:40;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{appearance:none;border:0;background:none;color:#9DB4FF;font-weight:600;padding:2px 0;cursor:pointer}

/* ---------- Sheets ---------- */
dialog.sheet{border:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:560px;border-radius:16px 16px 0 0;margin:auto auto 0;max-height:92vh;max-height:92dvh;overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 4px}
.sheet-title{font-size:17px;font-weight:600}
.sheet-body{padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-body p{font-size:15px;color:var(--text2);margin:0 0 14px}
.data-actions{display:flex;flex-direction:column;gap:10px}
.data-actions .btn-plain{padding:12px 16px;font-size:17px;border-radius:12px;background:var(--card)}
@media (min-width:620px){ dialog.sheet{margin:auto;border-radius:18px} }

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Chhinzer Track</span>
    <button class="icon-btn" id="dataBtn" type="button" aria-label="Your data and backups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v10.5m0 0l-4-4m4 4l4-4"/><path d="M4 15v3.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V15"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-inner">
    <button class="tab" type="button" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      Today
    </button>
    <button class="tab" type="button" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      History
    </button>
    <button class="tab" type="button" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5l5-5.5 4 3.5 7.5-8.5"/><path d="M3.5 20.5h17"/></svg>
      Progress
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="daySheet" aria-labelledby="daySheetTitle">
  <div class="sheet-head">
    <span class="sheet-title" id="daySheetTitle"></span>
    <button class="btn-text" type="button" id="daySheetDone">Done</button>
  </div>
  <div class="sheet-body"><div class="card" id="daySheetBody"></div></div>
</dialog>

<dialog class="sheet" id="dataSheet" aria-labelledby="dataSheetTitle">
  <div class="sheet-head">
    <span class="sheet-title" id="dataSheetTitle">Your data</span>
    <button class="btn-text" type="button" id="dataSheetDone">Done</button>
  </div>
  <div class="sheet-body">
    <p id="dataCount"></p>
    <p>Your check-ins are saved in this browser, on this device only. Clearing your browser data erases them, so download a backup now and then.</p>
    <div class="data-actions">
      <button class="btn-plain" type="button" id="exportBtn">Download backup</button>
      <button class="btn-plain" type="button" id="importBtn">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</dialog>

<script>
(function(){
'use strict';

/* ================= Constants ================= */
var LABELS = [null,'Awful','Very Bad','Bad','Not Great','Okay','Fine','Good','Great','Excellent','Amazing'];
var STORE_KEY = 'chhinzerTrack.v1';
var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var $ = function(s, r){ return (r||document).querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(6); }catch(e){} }
function r1(x){ return Math.round(x*10)/10; }
function f1(x){ return r1(x).toFixed(1); }

/* ================= Dates (local calendar days) ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateOf(k){ var p=k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function todayKey(){ return keyOf(new Date()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function daysBetween(a, b){ return Math.round((dateOf(b) - dateOf(a)) / 864e5); }
function fmtLong(k){ return dateOf(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function fmtMed(k){ return dateOf(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(d){ return (d instanceof Date ? d : dateOf(d)).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtMonth(d){ return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

/* ================= Storage ================= */
/* DailyWellnessEntry { id, date (YYYY-MM-DD local), overallFeeling (1-10 int), note, createdAt, updatedAt }
   Entries are keyed by date, so only one entry can exist per calendar day.
   Extra fields (energy, stress, etc.) can be added to an entry later without changing this structure. */
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.entries && typeof d.entries === 'object') return d; }
  }catch(e){}
  return { version:1, entries:{} };
}
var db = load();
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
  catch(e){ toast("Couldn't save. This browser is blocking storage."); return false; }
}
function validScore(v){ return Number.isInteger(v) && v>=1 && v<=10; }
function getEntry(k){ return db.entries[k] || null; }
function setScore(k, v){
  if(!validScore(v) || k > todayKey()) return;
  var now = new Date().toISOString(), e = db.entries[k];
  if(e){ if(e.overallFeeling === v) return; e.overallFeeling = v; e.updatedAt = now; }
  else { db.entries[k] = { id:uid(), date:k, overallFeeling:v, note:'', createdAt:now, updatedAt:now }; }
  persist();
}
function setNote(k, note){
  var e = db.entries[k]; if(!e || e.note === note) return false;
  e.note = note; e.updatedAt = new Date().toISOString(); persist(); return true;
}
function removeEntry(k){ var e = db.entries[k]; delete db.entries[k]; persist(); return e; }
function restoreEntry(e){ db.entries[e.date] = e; persist(); }

/* ================= Faces ================= */
var STOPS = [[1,[142,155,179]],[5.5,[216,210,196]],[10,[255,200,61]]];
function faceColor(v){
  var a = STOPS[0], b = STOPS[1];
  if(v > STOPS[1][0]){ a = STOPS[1]; b = STOPS[2]; }
  var t = Math.max(0, Math.min(1, (v-a[0])/(b[0]-a[0])));
  return 'rgb(' + a[1].map(function(x,i){ return Math.round(x+(b[1][i]-x)*t); }).join(',') + ')';
}
function faceGeom(v){
  var empty = (v == null);
  var val = empty ? 5.4 : v;
  var t = (val-1)/9, mw = 3*t, my = 66, c = empty ? 0 : (-20 + 42*t);
  return {
    empty: empty,
    fill: empty ? 'var(--card2)' : faceColor(val),
    ink: empty ? 'var(--text3)' : 'rgba(28,28,30,.86)',
    mouth: 'M'+(33-mw).toFixed(2)+' '+my+' Q50 '+(my+c).toFixed(2)+' '+(67+mw).toFixed(2)+' '+my,
    eyeRy: (6 - 1.6*t).toFixed(2),
    brow: (!empty && t < 0.45) ? ((0.45-t)/0.45).toFixed(3) : '0'
  };
}
function faceMarkup(v, cls){
  var g = faceGeom(v);
  return '<svg class="'+(cls||'')+'" viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
    '<circle class="f-bg" cx="50" cy="50" r="46" style="fill:'+g.fill+'"/>' +
    '<g class="f-ink" style="stroke:'+g.ink+';fill:'+g.ink+'">' +
      '<path class="f-brow" d="M28 31 L42 25.5" fill="none" stroke-width="4.5" stroke-linecap="round" style="opacity:'+g.brow+'"/>' +
      '<path class="f-brow" d="M72 31 L58 25.5" fill="none" stroke-width="4.5" stroke-linecap="round" style="opacity:'+g.brow+'"/>' +
      '<ellipse class="f-eye" cx="37" cy="43" rx="4.4" ry="'+g.eyeRy+'" stroke="none"/>' +
      '<ellipse class="f-eye" cx="63" cy="43" rx="4.4" ry="'+g.eyeRy+'" stroke="none"/>' +
      '<path class="f-mouth" d="'+g.mouth+'" fill="none" stroke-width="5" stroke-linecap="round"/>' +
    '</g></svg>';
}
function applyFace(svg, v){
  var g = faceGeom(v);
  svg.querySelector('.f-bg').style.fill = g.fill;
  var ink = svg.querySelector('.f-ink'); ink.style.stroke = g.ink; ink.style.fill = g.ink;
  svg.querySelectorAll('.f-brow').forEach(function(b){ b.style.opacity = g.brow; });
  svg.querySelectorAll('.f-eye').forEach(function(e){ e.setAttribute('ry', g.eyeRy); });
  svg.querySelector('.f-mouth').setAttribute('d', g.mouth);
}
function animateFace(svg, to){
  var from = svg._v;
  svg._v = to;
  if(svg._raf) cancelAnimationFrame(svg._raf);
  if(reduceMotion || from == null || to == null || from === to){ applyFace(svg, to); return; }
  var start = performance.now(), dur = 170;
  (function step(now){
    var p = Math.min(1, (now-start)/dur), e = 1 - Math.pow(1-p, 3);
    applyFace(svg, from + (to-from)*e);
    if(p < 1) svg._raf = requestAnimationFrame(step);
  })(start);
}

/* ================= Toast ================= */
var toastTimer;
function hideToast(){ $('#toast').classList.remove('show'); }
function toast(msg, action){
  var t = $('#toast'); t.innerHTML = '';
  var s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if(action){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.onclick = function(){ hideToast(); action.run(); };

}

/* ================= Check-in editor (used on Today and in History) ================= */
function createEditor(dateKey, opts){
  opts = opts || {};
  var entry = getEntry(dateKey);
  var current = entry ? entry.overallFeeling : null;
  var lastPreview = current;
  var noteOpen = !!(entry && entry.note) || !!opts.openNote;

  var root = document.createElement('div');
  root.className = 'editor';
  var nums = '';
  for(var n=1;n<=10;n++) nums += '<button type="button" class="num" data-n="'+n+'" aria-pressed="false" aria-label="'+n+', '+LABELS[n]+'">'+n+'</button>';
  root.innerHTML =
    '<div class="face-stage">'+faceMarkup(current,'face-big')+'</div>' +
    '<div class="readout" aria-live="polite"><span class="readout-num"></span><span class="readout-label"></span></div>' +
    '<div class="scale">' +
      '<span class="scale-end">'+faceMarkup(1)+'</span>' +
      '<input class="range" type="range" min="1" max="10" step="1" aria-label="How do you feel? 1 is worst, 10 is best">' +
      '<span class="scale-end">'+faceMarkup(10)+'</span>' +
    '</div>' +
    '<div class="nums" role="group" aria-label="Choose a score from 1 to 10">'+nums+'</div>' +
    '<div class="extras"></div>';

  var face = root.querySelector('.face-big'); face._v = current;
  var range = root.querySelector('.range');
  var readout = root.querySelector('.readout');
  var extras = root.querySelector('.extras');
  var buttons = root.querySelectorAll('.num');

  function showValue(v){
    if(v == null){
      readout.classList.add('empty');
      readout.querySelector('.readout-num').innerHTML = '';
      readout.querySelector('.readout-label').textContent = 'Tap a number or slide to choose';
    } else {
      readout.classList.remove('empty');
      readout.querySelector('.readout-num').innerHTML = v + '<small>/10</small>';
      readout.querySelector('.readout-label').textContent = LABELS[v];
    }
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', String(Number(b.dataset.n) === v)); });
    range.value = (v == null ? 5 : v);
    range.classList.toggle('unset', v == null);
    range.setAttribute('aria-valuetext', v == null ? 'No score yet' : v + ', ' + LABELS[v]);
    animateFace(face, v);
  }
  function preview(v){
    if(v !== lastPreview){ haptic(); lastPreview = v; }
    showValue(v);
  }
  function commit(v){
    v = Number(v);
    if(!validScore(v)) return;
    var wasNew = !getEntry(dateKey), prev = current;
    if(!wasNew && prev === v){ showValue(v); return; }
    setScore(dateKey, v);
    current = v; lastPreview = v;
    showValue(v);
    toast('Saved');
    renderExtras();
    if(opts.onCommit) opts.onCommit(v, wasNew);
  }

  range.addEventListener('input', function(){ preview(Number(range.value)); });
  range.addEventListener('change', function(){ commit(range.value); });
  range.addEventListener('pointerup', function(){ if(current == null) commit(range.value); });
  buttons.forEach(function(b){
    b.addEventListener('click', function(){ var v = Number(b.dataset.n); preview(v); commit(v); });
  });

  function renderExtras(){
    extras.innerHTML = '';
    if(current == null) return;
    var e = getEntry(dateKey);

    if(noteOpen){
      var id = 'note-' + dateKey;
      var wrap = document.createElement('div');
      wrap.innerHTML = '<label class="visually-hidden" for="'+id+'">Note</label>' +
        '<textarea class="note" id="'+id+'" maxlength="500" placeholder="Add a note (optional)"></textarea>' +
        '<div class="note-status" aria-live="polite">Saved</div>';
      var ta = wrap.querySelector('textarea'), status = wrap.querySelector('.note-status');
      ta.value = e && e.note ? e.note : '';
      var timer, statusTimer;
      var saveNote = function(){
        clearTimeout(timer);
        if(!getEntry(dateKey)) return;
        if(setNote(dateKey, ta.value.trim())){
          status.classList.add('on');
          clearTimeout(statusTimer);
          statusTimer = setTimeout(function(){ status.classList.remove('on'); }, 1200);
          if(opts.onNote) opts.onNote();
        }
      };
      ta.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(saveNote, 600); });
      ta.addEventListener('blur', saveNote);
      extras.appendChild(wrap);
      if(opts.focusNote){ opts.focusNote = false; requestAnimationFrame(function(){ ta.focus(); }); }
    } else {
      var add = document.createElement('button');
      add.type = 'button'; add.className = 'btn-text add-note'; add.textContent = 'Add a note';
      add.addEventListener('click', function(){
        noteOpen = true; opts.focusNote = true;
        if(opts.onNoteOpen) opts.onNoteOpen();
        renderExtras();
      });
      extras.appendChild(add);
    }

    var row = document.createElement('div'); row.className = 'row-actions';
    var rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'btn-text danger'; rm.textContent = 'Remove check-in';
    rm.addEventListener('click', remove);
    row.appendChild(rm);
    if(opts.onDone){
      var done = document.createElement('button');
      done.type = 'button'; done.className = 'btn-fill'; done.textContent = 'Done';
      done.addEventListener('click', function(){
        var ta = extras.querySelector('textarea'); if(ta) ta.blur();
        opts.onDone();
      });
      row.appendChild(done);
    }
    extras.appendChild(row);
  }

  function remove(){
    var e = getEntry(dateKey); if(!e) return;
    var ta = extras.querySelector('textarea');
    var hasNote = !!(e.note || (ta && ta.value.trim()));
    if(hasNote && !confirm('Remove this check-in? Your note will also be deleted.')) return;
    var removed = removeEntry(dateKey);
    current = null; lastPreview = null; noteOpen = false;
    showValue(null);
    renderExtras();
    if(!hasNote){
      toast('Check-in removed', { label:'Undo', run:function(){ restoreEntry(removed); rerenderAll(); } });
    } else {
      toast('Check-in removed');
    }
    if(opts.onRemove) opts.onRemove();
  }

  showValue(current);
  renderExtras();
  return root;
}

/* ----- Progress ----- */
var RANGES = { '1W':7, '1M':30, '3M':90, '6M':182, '1Y':365, 'ALL':null };
var rangeSel = '1M', cmpKind = 'month';

function sortedKeys(){ var tk = todayKey(); return Object.keys(db.entries).filter(function(k){ return k <= tk; }).sort(); }
function rangeKeys(){
  var tk = todayKey(), n = RANGES[rangeSel];
  if(n == null){ var ks = sortedKeys(); n = ks.length ? Math.max(7, daysBetween(ks[0], tk) + 1) : 7; }
  var out = [], base = dateOf(tk);
  for(var i=n-1;i>=0;i--) out.push(keyOf(addDays(base, -i)));
  return out;
}
function summarize(values){
  var v = values.filter(function(x){ return x != null; });
  if(!v.length) return { n:0, avg:null, hi:null, lo:null };
  var sum = v.reduce(function(a,b){ return a+b; }, 0);
  return { n:v.length, avg:sum/v.length, hi:Math.max.apply(null,v), lo:Math.min.apply(null,v) };
}
function segControl(options, selected, label, onPick){
  var s = document.createElement('div'); s.className = 'seg'; s.setAttribute('role','group'); s.setAttribute('aria-label', label);
  options.forEach(function(o){
    var b = document.createElement('button'); b.type = 'button';
    b.textContent = o[1]; b.setAttribute('aria-pressed', String(o[0] === selected));
    b.addEventListener('click', function(){ onPick(o[0]); });
    s.appendChild(b);
  });
  return s;
}

var chartState = null;
function renderProgress(){
  view.innerHTML = '';
  view.appendChild(titleBlock('Progress', 'Overall feeling, 1 to 10'));

  view.appendChild(segControl(
    Object.keys(RANGES).map(function(r){ return [r, r]; }), rangeSel, 'Time range',
    function(r){ rangeSel = r; renderProgress(); }
  ));

  var keys = rangeKeys();
  var vals = keys.map(function(k){ var e = db.entries[k]; return e ? e.overallFeeling : null; });
  var s = summarize(vals);

  var card = document.createElement('section'); card.className = 'card';
  card.innerHTML =
    '<div class="scrub" aria-live="polite"></div>' +
    '<div class="chart-host"></div>' +
    '<div class="stats">' +
      '<div><div class="stat-label">Average</div><div class="stat-value">'+(s.n ? f1(s.avg)+'<small> / 10</small>' : '<small>No check-ins</small>')+'</div></div>' +
      '<div><div class="stat-label">Recorded</div><div class="stat-value">'+s.n+'<small> of '+keys.length+' days</small></div></div>' +
      '<div><div class="stat-label">Highest</div><div class="stat-value">'+(s.n ? s.hi+'<small>/10</small>' : '<small>None yet</small>')+'</div></div>' +
      '<div><div class="stat-label">Lowest</div><div class="stat-value">'+(s.n ? s.lo+'<small>/10</small>' : '<small>None yet</small>')+'</div></div>' +
    '</div>';
  view.appendChild(card);
  chartState = { keys:keys, vals:vals, avg:s.avg, n:s.n, host:card.querySelector('.chart-host'), panel:card.querySelector('.scrub') };
  setScrubHint();
  drawChart();

  var h = document.createElement('h2'); h.className = 'section-title'; h.textContent = 'Compare periods';
  view.appendChild(h);
  var cmp = document.createElement('section'); cmp.className = 'card';
  cmp.appendChild(segControl([['week','Week'],['month','Month'],['year','Year']], cmpKind, 'Comparison period',
    function(k){ cmpKind = k; renderProgress(); }));
  cmp.appendChild(buildComparison());
  view.appendChild(cmp);

  var foot = document.createElement('p'); foot.className = 'footnote';
  foot.textContent = 'Days without a check-in are left out of every average, never counted as zero. Comparisons with steps, calories and workouts will appear once those are tracked here.';
  view.appendChild(foot);
}

function setScrubHint(){
  var p = chartState.panel;
  p.innerHTML = chartState.n
    ? '<div class="scrub-hint">Touch and drag across the graph to see each day.</div>'
    : '<div class="scrub-hint">No check-ins in this period yet. Check in on the Today tab and your graph starts here.</div>';
}

function drawChart(){
  if(!chartState) return;
  var cs = chartState, host = cs.host, keys = cs.keys, vals = cs.vals;
  var W = Math.max(260, Math.round(host.clientWidth || 320)), H = 210;
  var pl = 24, pr = 8, pt = 12, pb = 26, iw = W-pl-pr, ih = H-pt-pb, n = keys.length;
  var X = function(i){ return n < 2 ? pl + iw/2 : pl + i*iw/(n-1); };
  var Y = function(v){ return pt + (10-v)*ih/9; };
  var out = [];
  out.push('<svg class="chart" viewBox="0 0 '+W+' '+H+'" tabindex="0" role="img" aria-label="Overall feeling graph, '+cs.n+' check-ins over '+n+' days'+(cs.n ? ', average '+f1(cs.avg) : '')+'. Use left and right arrow keys to step through days.">');
  for(var v=1; v<=10; v++){
    var major = (v===1 || v===5 || v===10);
    out.push('<line class="g-line'+(major?' major':'')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>');
    if(major) out.push('<text class="g-text" x="'+(pl-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v+'</text>');
  }
  var d = '';
  for(var i=1;i<n;i++){
    if(vals[i] != null && vals[i-1] != null)
      d += 'M'+X(i-1).toFixed(1)+' '+Y(vals[i-1]).toFixed(1)+'L'+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1);
  }
  if(d) out.push('<path class="c-line" d="'+d+'"/>');
  if(cs.n){
    var ay = Y(cs.avg).toFixed(1);
    out.push('<line class="c-avg" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ay+'" y2="'+ay+'"/>');
    out.push('<text class="c-avg-t" x="'+(W-pr)+'" y="'+(Number(ay)-6)+'" text-anchor="end">Avg '+f1(cs.avg)+'</text>');
  }
  var r = n <= 31 ? 4.5 : (n <= 100 ? 3 : 2);
  for(var j=0;j<n;j++){
    if(vals[j] == null) continue;
    out.push('<circle class="c-dot" cx="'+X(j).toFixed(1)+'" cy="'+Y(vals[j]).toFixed(1)+'" r="'+r+'" style="fill:'+faceColor(vals[j])+'"/>');
  }
  var ticks = n >= 7 ? [0, Math.floor((n-1)/2), n-1] : [0, n-1];
  var anchors = n >= 7 ? ['start','middle','end'] : ['start','end'];
  ticks.forEach(function(ti, idx){
    out.push('<text class="g-text" x="'+X(ti).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anchors[idx]+'">'+fmtShort(keys[ti])+'</text>');
  });
  if(!cs.n) out.push('<text class="c-empty" x="'+(pl+iw/2)+'" y="'+(pt+ih/2)+'" text-anchor="middle">No check-ins yet</text>');
  out.push('<g class="c-scrub-g" style="display:none"><line class="c-scrub" y1="'+pt+'" y2="'+(H-pb)+'"/><circle class="c-ring" r="'+(r+3.5)+'"/></g>');
  out.push('</svg>');
  host.innerHTML = out.join('');

  var svg = host.querySelector('svg'), g = svg.querySelector('.c-scrub-g');
  var line = g.querySelector('line'), ring = g.querySelector('circle');
  var active = null, down = false;

  function nearest(i){
    for(var dd=0; dd<n; dd++){
      if(i-dd >= 0 && vals[i-dd] != null) return i-dd;
      if(i+dd < n && vals[i+dd] != null) return i+dd;
    }
    return null;
  }
  function show(i){
    if(i == null) return;
    active = i;
    g.style.display = '';
    line.setAttribute('x1', X(i)); line.setAttribute('x2', X(i));
    ring.setAttribute('cx', X(i)); ring.setAttribute('cy', Y(vals[i]));
    var e = db.entries[keys[i]];
    cs.panel.innerHTML =
      '<div class="scrub-date">'+esc(fmtMed(keys[i]))+'</div>' +
      '<div class="scrub-score">'+faceMarkup(vals[i],'mini')+vals[i]+'/10 <span class="lbl">'+LABELS[vals[i]]+'</span></div>' +
      (e && e.note ? '<div class="scrub-note">\u201C'+esc(e.note)+'\u201D</div>' : '');
  }
  function fromPointer(ev){
    if(!cs.n) return;
    var rect = svg.getBoundingClientRect();
    var px = (ev.clientX - rect.left) * (W / rect.width);
    var i = n < 2 ? 0 : Math.round((px - pl) / iw * (n-1));
    i = Math.max(0, Math.min(n-1, i));
    var k = nearest(i);
    if(k !== active){ if(active != null) haptic(); show(k); }
  }
  svg.addEventListener('pointerdown', function(ev){ down = true; try{ svg.setPointerCapture(ev.pointerId); }catch(e){} fromPointer(ev); });
  svg.addEventListener('pointermove', function(ev){ if(down || ev.pointerType === 'mouse') fromPointer(ev); });
  svg.addEventListener('pointerup', function(){ down = false; });
  svg.addEventListener('pointercancel', function(){ down = false; });
  svg.addEventListener('keydown', function(ev){
    if(!cs.n) return;
    var dir = ev.key === 'ArrowRight' ? 1 : (ev.key === 'ArrowLeft' ? -1 : 0);
    if(!dir) return;
    ev.preventDefault();
    var i = active == null ? (dir > 0 ? -1 : n) : active;
    for(i += dir; i >= 0 && i < n; i += dir){ if(vals[i] != null){ show(i); return; } }
  });
}

function periodBounds(kind, off){
  var t = dateOf(todayKey()), y = t.getFullYear(), m = t.getMonth();
  if(kind === 'week'){
    var dow = (t.getDay() + 6) % 7;                 // weeks start Monday
    var start = addDays(t, -dow + 7*off);
    return { start:start, end: off === 0 ? t : addDays(start, 6) };
  }
  if(kind === 'month'){
    return { start:new Date(y, m+off, 1), end: off === 0 ? t : new Date(y, m+off+1, 0) };
  }
  return { start:new Date(y+off, 0, 1), end: off === 0 ? t : new Date(y+off, 11, 31) };
}
function periodStats(b){
  var vals = [];
  for(var d = new Date(b.start); d <= b.end; d = addDays(d, 1)){
    var e = db.entries[keyOf(d)]; vals.push(e ? e.overallFeeling : null);
  }
  var s = summarize(vals); s.days = vals.length; return s;
}
function periodRangeText(kind, b){
  if(kind === 'week') return fmtShort(b.start) + ' to ' + fmtShort(b.end);
  if(kind === 'month') return fmtMonth(b.start);
  return String(b.start.getFullYear());
}
function buildComparison(){
  var names = { week:['This week','Last week'], month:['This month','Last month'], year:['This year','Last year'] }[cmpKind];
  var bc = periodBounds(cmpKind, 0), bp = periodBounds(cmpKind, -1);
  var a = periodStats(bc), b = periodStats(bp);
  function col(name, bounds, s){
    return '<div><div class="period-name">'+name+'</div>' +
      '<div class="period-range">'+esc(periodRangeText(cmpKind, bounds))+'</div>' +
      '<div class="period-avg">'+(s.n ? f1(s.avg)+'<small> / 10</small>' : '<small>No check-ins</small>')+'</div>' +
      '<div class="period-meta">'+s.n+' of '+s.days+' days recorded</div>' +
      (s.n ? '<div class="period-meta">High '+s.hi+', low '+s.lo+'</div>' : '') +
    '</div>';
  }
  var wrap = document.createElement('div');
  var change;
  if(a.n >= 3 && b.n >= 3){
    var cur = r1(a.avg), prev = r1(b.avg), diff = r1(cur - prev);
    if(diff === 0){
      change = '<div class="change-label">Change</div><div class="change-main">No change</div>';
    } else {
      var sign = diff > 0 ? '+' : '\u2212';
      var pct = prev > 0 ? '<span class="change-pct">('+sign+Math.abs(diff/prev*100).toFixed(1)+'%)</span>' : '';
      change = '<div class="change-label">Change</div><div class="change-main">'+sign+Math.abs(diff).toFixed(1)+' points'+pct+'</div>';
    }
  } else {
    change = '<div class="change-none">Not enough check-ins to compare yet. Each period needs at least 3.</div>';
  }
  wrap.innerHTML = '<div class="compare">'+col(names[0], bc, a)+col(names[1], bp, b)+'</div><div class="change">'+change+'</div>';
  return wrap;
}

/* ================= Data: backup & restore ================= */
var dataSheet = $('#dataSheet');
$('#dataBtn').addEventListener('click', function(){
  var c = sortedKeys().length;
  $('#dataCount').textContent = c === 1 ? '1 check-in saved.' : c + ' check-ins saved.';
  dataSheet.showModal();
});
$('#dataSheetDone').addEventListener('click', function(){ dataSheet.close(); });
dataSheet.addEventListener('click', function(ev){ if(ev.target === dataSheet) dataSheet.close(); });
$('#exportBtn').addEventListener('click', function(){
  var entries = sortedKeys().map(function(k){ return db.entries[k]; });
  var blob = new Blob([JSON.stringify({ app:'Chhinzer Track', version:1, exportedAt:new Date().toISOString(), entries:entries }, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chhinzer-track-backup-' + todayKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast('Backup downloaded');
});
$('#importBtn').addEventListener('click', function(){ $('#importFile').click(); });
$('#importFile').addEventListener('change', function(){
  var file = this.files && this.files[0]; this.value = '';
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      var list = Array.isArray(data) ? data
        : Array.isArray(data.entries) ? data.entries
        : (data.entries && typeof data.entries === 'object') ? Object.keys(data.entries).map(function(k){ return data.entries[k]; }) : [];
      var tk = todayKey();
      var valid = list.filter(function(e){ return e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.date <= tk && validScore(e.overallFeeling); });
      if(!valid.length){ toast('No check-ins found in that file.'); return; }
      if(!confirm('Restore ' + valid.length + ' check-ins? Days in the backup replace the same days on this device.')) return;
      var now = new Date().toISOString();
      valid.forEach(function(e){
        var copy = Object.assign({}, e);
        copy.id = e.id || uid();
        copy.note = typeof e.note === 'string' ? e.note : '';
        copy.createdAt = e.createdAt || now;
        copy.updatedAt = e.updatedAt || now;
        db.entries[e.date] = copy;
      });
      persist();
      dataSheet.close();
      rerenderAll();
      toast('Restored ' + valid.length + ' check-ins');
    }catch(err){ toast("That file isn't a Chhinzer Track backup."); }
  };
  reader.readAsText(file);
});

/* ================= Navigation ================= */
var VIEWS = { today:renderToday, history:renderHistory, progress:renderProgress };
function renderView(){ chartState = null; VIEWS[currentTab](); }
function rerenderAll(){ if(daySheetKey) fillDaySheet(); renderView(); }
function go(tab){
  if(!VIEWS[tab]) tab = 'today';
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){
    if(t.dataset.tab === tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  renderView();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    if(location.hash === '#' + t.dataset.tab) go(t.dataset.tab);
    else location.hash = t.dataset.tab;
  });
});
window.addEventListener('hashchange', function(){ go(location.hash.slice(1)); });

var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ if(currentTab === 'progress' && chartState){ setScrubHint(); drawChart(); } }, 150);
});

/* A new day starts at local midnight: refresh when the app comes back into view. */
var lastDay = todayKey();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  if(todayKey() !== lastDay){ lastDay = todayKey(); todayEditing = false; todayOpenNote = false; if(!daySheet.open) renderView(); }
});
/* Keep open tabs in sync if the app is open in two windows. */
window.addEventListener('storage', function(ev){ if(ev.key === STORE_KEY){ db = load(); rerenderAll(); } });

go(location.hash.slice(1) || 'today');
})();
</script>
